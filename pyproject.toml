[project]
name = "trec-tot-2025"
version = "0.1.1"
authors = [
    { name = "Anthony Miyaguchi", email = "acmiyaguchi@gatech.edu" }, 
    {name = "Wenxin Zhou", email = "wenxinmmb@gmail.com" }, 
    { name = "Ritesh Mehta", email = "rmehta307@gatech.edu" }
]
description = "DS@GT TREC 2025 Tip-of-the-Tongue Track"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "scikit-learn>=1.3.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3.8",
]

[project.urls]
Homepage = "https://github.com/dsgt-arc/trec-tot-2025"
Issues = "https://github.com/dsgt-arc/trec-tot-2025/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trec_tot*"]
namespaces = false

